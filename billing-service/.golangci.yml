version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
  exclusions:
    rules:
      # Tests close listeners, response bodies and processes in defers, and a failed close there is no signal.
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
