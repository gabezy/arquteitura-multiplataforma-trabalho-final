name: catalog-service

# main only receives changes through merged pull requests (branch protection),
# so a push to main is always a merge: it runs CI and then CD.
# Any other branch runs CI only, on push and on pull request.
on:
  push:
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'
      - '.github/workflows/_node-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'
      - '.github/workflows/_node-service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: catalog-service

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omni-market-catalog-service" >> "$GITHUB_ENV"

      # Tests already passed in the ci job for this same commit.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: catalog-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=catalog-service
          cache-to: type=gha,mode=max,scope=catalog-service

      # TODO: run migrations and deploy once the target environment is defined.
