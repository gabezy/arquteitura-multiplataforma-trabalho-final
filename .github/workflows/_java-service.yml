name: java-service

on:
  workflow_call:
    inputs:
      service:
        description: Service directory at the repository root
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ inputs.service }}/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-test-reports
          path: ${{ inputs.service }}/target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validates the Dockerfile on every change; the image is pushed only by CD.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service }}
          push: false
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
