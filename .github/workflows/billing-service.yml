name: billing-service

# main only receives changes through merged pull requests (branch protection),
# so a push to main is always a merge: it runs CI and then CD.
# Any other branch runs CI only, on push and on pull request. The pull request
# trigger covers dev too, and its path filter looks at the whole diff of the pull
# request, so a docs-only last commit does not leave the pull request without checks.
on:
  push:
    paths:
      - 'billing-service/**'
      - '.github/workflows/billing-service.yml'
      - '.github/workflows/_go-service.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'billing-service/**'
      - '.github/workflows/billing-service.yml'
      - '.github/workflows/_go-service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: ./.github/workflows/_go-service.yml
    with:
      service: billing-service

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omni-market-billing-service" >> "$GITHUB_ENV"

      # Tests already passed in the ci job for this same commit.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: billing-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=billing-service
          cache-to: type=gha,mode=max,scope=billing-service

      # TODO: deploy once the target environment is defined (the image migrates on startup).
