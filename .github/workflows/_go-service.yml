name: go-service

on:
  workflow_call:
    inputs:
      service:
        description: Service directory at the repository root
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      # Go comes from the go directive of the service's go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ inputs.service }}

      # The runner has Docker, so the Testcontainers-backed tests run here too.
      - name: Test
        run: go test -race -count=1 ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validates the Dockerfile for both architectures on every change; the image is pushed only by CD.
      # The Dockerfile cross-compiles, so the arm64 build needs no emulation.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
