name: kind-deploy

on:
  workflow_dispatch:

jobs:
  deploy-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Check local Kubernetes tools
        run: command -v kubectl && command -v helm && command -v docker
      - name: Build and deploy the local stack
        run: make k8s-up
      - name: Show cluster status
        run: make k8s-status
