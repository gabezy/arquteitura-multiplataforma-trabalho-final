server:
  http_listen_port: 3200
  grpc_listen_port: 9095

stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

backend_worker:
  compaction:
    block_retention: 48h

# The span metrics and the service graph are generated by the otel-collector (connectors), not here.
