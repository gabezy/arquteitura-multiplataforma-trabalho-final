auth_enabled: false

server:
  http_listen_port: 3100
  # The querier answers through gRPC, limited to 4 MiB by default: 1000 lines of the BFF error logs
  # (Explore and the dashboard) are larger than that: the error logs carry the stack trace (~17 KB).
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

frontend_worker:
  grpc_client_config:
    max_recv_msg_size: 67108864
    max_send_msg_size: 67108864

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 48h
  max_query_lookback: 48h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem
