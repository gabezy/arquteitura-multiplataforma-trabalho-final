apiVersion: 1

# Loki got a fixed uid (referenced by Tempo and by the dashboards). A Grafana volume created before
# that keeps it with a random uid and the provisioning fails, so it is deleted and created again.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: Tempo

  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: Loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: Prometheus

  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      # Links the exemplars of the latency histograms (span metrics) to the trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Tempo
