{{- if .Values.applicationWorkloads.enabled }}
{{- range .Values.apps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: 1
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
{{- range .env }}
            - name: {{ .name }}
{{- if hasKey . "secretKey" }}
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: {{ .secretKey }}
{{- else }}
              value: {{ .value | quote }}
{{- end }}
{{- end }}
          startupProbe:
            httpGet:
              path: {{ .healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ .healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
      nodePort: {{ .nodePort }}
---
{{- end }}
{{- end }}
