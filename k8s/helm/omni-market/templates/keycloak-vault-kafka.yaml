apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      initContainers:
        - name: render-realm
          image: python:3.13-alpine
          command:
            - python
            - -c
            - "from pathlib import Path; import os; s=Path('/template/realm.json').read_text(); Path('/import/realm.json').write_text(s.replace('${BFF_CLIENT_SECRET}', os.environ['BFF_CLIENT_SECRET']))"
          env:
            - name: BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: BFF_CLIENT_SECRET
          volumeMounts:
            - { name: realm-template, mountPath: /template, readOnly: true }
            - { name: realm-import, mountPath: /import }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          args: ["start-dev", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: KEYCLOAK_ADMIN_USER
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - { name: KC_HTTP_PORT, value: "8080" }
            - { name: KC_HOSTNAME, value: http://localhost:8085 }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          volumeMounts:
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
          startupProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            initialDelaySeconds: 45
            periodSeconds: 10
      volumes:
        - name: realm-template
          configMap:
            name: omni-market-config
            items:
              - { key: realm.json, path: realm.json }
        - name: realm-import
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30085 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:2.2.1
          args: ["server", "-dev"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: VAULT_ROOT_TOKEN
            - { name: VAULT_DEV_LISTEN_ADDRESS, value: 0.0.0.0:8200 }
            - { name: VAULT_ADDR, value: http://127.0.0.1:8200 }
          ports:
            - { name: http, containerPort: 8200 }
          securityContext:
            capabilities:
              add: [IPC_LOCK]
          readinessProbe:
            exec:
              command: ["sh", "-c", "vault status -address=http://127.0.0.1:8200 >/dev/null"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "vault status -address=http://127.0.0.1:8200 >/dev/null"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - { name: http, port: 8200, targetPort: http }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: hashicorp/vault:2.2.1
          command: ["sh", "-c"]
          args:
            - until vault status -address=http://vault:8200 >/dev/null 2>&1; do sleep 3; done; exec sh /scripts/bootstrap.sh
          env:
            - { name: VAULT_ADDR, value: http://vault:8200 }
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: VAULT_ROOT_TOKEN
            - { name: CATALOG_DB_USER, value: catalog }
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: CATALOG_DB_PASSWORD
            - { name: COMPLIANCE_DB_USER, value: compliance }
            - name: COMPLIANCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: COMPLIANCE_DB_PASSWORD
            - { name: ORDER_DB_USER, value: orders }
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: ORDER_DB_PASSWORD
            - name: CATALOG_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: CATALOG_VAULT_ROLE_ID
            - name: CATALOG_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: CATALOG_VAULT_SECRET_ID
            - name: COMPLIANCE_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: COMPLIANCE_VAULT_ROLE_ID
            - name: COMPLIANCE_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: COMPLIANCE_VAULT_SECRET_ID
            - name: ORDER_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: ORDER_VAULT_ROLE_ID
            - name: ORDER_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: ORDER_VAULT_SECRET_ID
            - name: BFF_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: BFF_VAULT_ROLE_ID
            - name: BFF_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: BFF_VAULT_SECRET_ID
            - name: BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni-market-secrets
                  key: BFF_CLIENT_SECRET
          volumeMounts:
            - { name: config, mountPath: /scripts, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: omni-market-config
            defaultMode: 0555
            items:
              - { key: vault-bootstrap.sh, path: bootstrap.sh }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - { name: internal, containerPort: 19092 }
            - { name: external, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: dnEkEjWqSQ-ww5Fe2gkszA }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          readinessProbe:
            tcpSocket: { port: internal }
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket: { port: internal }
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  publishNotReadyAddresses: true
  type: NodePort
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - { name: internal, port: 19092, targetPort: internal }
    - { name: external, port: 9092, targetPort: external, nodePort: 30092 }
    - { name: controller, port: 9093, targetPort: controller }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.3.1
          command: ["sh", "-c"]
          args:
            - until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1; do sleep 3; done; exec sh /scripts/create-topics.sh
          env:
            - { name: KAFKA_BOOTSTRAP_SERVER, value: kafka:19092 }
          volumeMounts:
            - { name: config, mountPath: /scripts, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: omni-market-config
            defaultMode: 0555
            items:
              - { key: create-topics.sh, path: create-topics.sh }
