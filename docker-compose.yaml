services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8085
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8085:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      # The first start builds Keycloak's optimized config, which is slow when the whole stack starts at once.
      start_period: 120s

  catalog-db:
    image: postgres:18-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  compliance-db:
    image: postgres:18-alpine
    container_name: compliance-db
    environment:
      POSTGRES_DB: ${COMPLIANCE_DB_NAME:-compliance}
      POSTGRES_USER: ${COMPLIANCE_DB_USER:-compliance}
      POSTGRES_PASSWORD: ${COMPLIANCE_DB_PASSWORD:-compliance}
    ports:
      - "5433:5432"
    volumes:
      - compliance-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-db:
    image: postgres:18-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-orders}
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  marketplace-db:
    image: postgres:18-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: ${MARKETPLACE_DB_NAME:-marketplace}
      POSTGRES_USER: ${MARKETPLACE_DB_USER:-marketplace}
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:-marketplace}
    ports:
      - "5436:5432"
    volumes:
      - marketplace-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-dnEkEjWqSQ-ww5Fe2gkszA}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers reach the broker at kafka:19092, apps on the host at localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      # The check starts a JVM, which takes several seconds when the whole stack starts at once.
      timeout: 30s
      retries: 10
      start_period: 60s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    restart: "no"
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: omni-market
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: 3000
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
  
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command: ["-config.file=/etc/local-config.yaml"]
    expose:
      - "3100"
    volumes:
      - loki-data:/loki
      - ./docker/loki/config.yaml:/etc/local-config.yaml
  
  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]    
    volumes:
      - tempo-data:/var/tempo
      - ./docker/tempo/config.yaml:/etc/tempo.yaml
    expose:
      - "3200"
    
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    expose:
      - "8889"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=48h
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings
      - ./docker/wiremock/__files:/home/wiremock/__files

  # Applications, built from source. `make up-infra` leaves them out, for whoever runs a service
  # from its own directory.
  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    environment:
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@catalog-db:5432/${CATALOG_DB_NAME:-catalog}
      KAFKA_BROKERS: kafka:19092
      OTEL_COLLECTOR_URL: http://otel-collector:4318
    ports:
      - "8082:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  compliance-service:
    build: ./compliance-service
    container_name: compliance-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${COMPLIANCE_DB_USER:-compliance}:${COMPLIANCE_DB_PASSWORD:-compliance}@compliance-db:5432/${COMPLIANCE_DB_NAME:-compliance}
      KAFKA_BROKERS: kafka:19092
      OTEL_COLLECTOR_URL: http://otel-collector:4318
    ports:
      - "8083:8083"
    depends_on:
      compliance-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DATABASE_URL: postgresql://${ORDER_DB_USER:-orders}:${ORDER_DB_PASSWORD:-orders}@order-db:5432/${ORDER_DB_NAME:-orders}
      KAFKA_BROKERS: kafka:19092
      OTEL_COLLECTOR_URL: http://otel-collector:4318
    ports:
      - "8084:8084"
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  marketplace-gateway:
    build: ./marketplace-gateway
    container_name: marketplace-gateway
    environment:
      DATABASE_URL: postgresql://${MARKETPLACE_DB_USER:-marketplace}:${MARKETPLACE_DB_PASSWORD:-marketplace}@marketplace-db:5432/${MARKETPLACE_DB_NAME:-marketplace}
      KAFKA_BROKERS: kafka:19092
      OTEL_COLLECTOR_URL: http://otel-collector:4318
      # The marketplaces are the simulators of docker/wiremock.
      AMAZON_BASE_URL: http://wiremock:8080/amazon
      MERCADO_LIVRE_BASE_URL: http://wiremock:8080/mercadolivre
      SHOPEE_BASE_URL: http://wiremock:8080/shopee
    ports:
      - "8087:8087"
    depends_on:
      marketplace-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_started

  bff-gateway:
    build: ./bff-gateway
    container_name: bff-gateway
    environment:
      # Tokens fetched from the host carry iss=http://localhost:8085/realms/omni-market (KC_HOSTNAME),
      # so that is the issuer the BFF validates. The signing keys come from Keycloak inside the network.
      KEYCLOAK_ISSUER_URI: http://localhost:8085/realms/omni-market
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/omni-market/protocol/openid-connect/certs
      CATALOG_SERVICE_URL: http://catalog-service:8082
      OTEL_COLLECTOR_URL: http://otel-collector:4318
    ports:
      - "${BFF_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

volumes:
  keycloak-data:
  catalog-db-data:
  compliance-db-data:
  order-db-data:
  marketplace-db-data:
  kafka-data:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
